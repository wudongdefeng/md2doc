<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>md2doc 在线转换</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
    textarea { width: 100%; height: 300px; font-family: monospace; }
    .row { display: flex; gap: 12px; margin-top: 12px; }
    .col { flex: 1; }
    .controls { margin-top: 12px; }
  </style>
</head>
<body>
  <h1>md2doc - 在线将 Markdown 转为 Word (.docx)</h1>
  <p>你可以粘贴 Markdown 到文本框，或者上传一个 .md 文件，然后点击“转换并下载”。</p>

  <form id="frm">
    <div>
      <label>上传 .md 文件（可选）： <input type="file" id="fileInput" accept=".md,.markdown,text/markdown"></label>
    </div>
    <div>
      <label>或直接粘贴 Markdown 文本：</label>
      <textarea id="md"></textarea>
    </div>
    <div class="controls">
      <label>文档标题（可选）： <input type="text" id="title" placeholder="文档标题"></label>
    </div>
    <div class="controls">
      <label>自定义 CSS（可选，用于控制导出样式）：</label>
      <textarea id="css" style="height:120px" placeholder="p { font-size: 14pt }"></textarea>
    </div>
    <div class="controls">
      <button type="submit">转换并下载 .docx</button>
    </div>
  </form>

  <script>
    const form = document.getElementById('frm');
    const fileInput = document.getElementById('fileInput');
    const mdArea = document.getElementById('md');

    fileInput.addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => { mdArea.value = reader.result; };
      reader.readAsText(f);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const md = mdArea.value || '';
      const title = document.getElementById('title').value || '';
      const css = document.getElementById('css').value || '';

      const fd = new FormData();
      fd.append('markdown', md);
      fd.append('title', title);
      fd.append('css', css);

      try {
        const resp = await fetch('/api/convert', { method: 'POST', body: fd });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          alert('转换失败: ' + (err.error || resp.statusText));
          return;
        }
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'converted.docx';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      } catch (err) {
        alert('请求出错: ' + err.message);
      }
    });
  </script>
</body>
</html>
